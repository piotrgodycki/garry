version: 2
updates:
  - package-ecosystem: npm
    directory: /garry-registry
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      registry-deps:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /garry-skills
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      skills-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
