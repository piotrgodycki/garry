name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck (tool packages)
        run: |
          pnpm -C garry-registry typecheck
          pnpm -C garry-skills typecheck
          pnpm -C garry-tool typecheck
          pnpm -C garry-ui typecheck
      - name: Build the dashboard
        run: pnpm -C garry-ui build
      - name: Validate registry (mfe and backend test registries)
        run: |
          pnpm -C garry-registry exec tsx src/cli.ts testdata/frontend
          pnpm -C garry-registry exec tsx src/cli.ts testdata/backend
      - name: Validate skills
        run: pnpm -C garry-skills validate
      # Every skill is a set of instructions an agent follows with access to code
      # and tokens: the pre-installed ones must pass the security audit, and the
      # audit itself must keep catching the known attacks.
      - name: Device pairing
        run: pnpm -C garry-tool test:auth
      - name: Services, features and stacks
        run: |
          pnpm -C garry-tool test:services
          pnpm -C garry-tool test:features
          pnpm -C garry-tool test:stacks
          pnpm -C garry-tool test:qa
          pnpm -C garry-tool test:routing
          pnpm -C garry-tool test:architecture
      # git needs an identity for the commits the test makes in its scratch repo
      - name: Agent threads (with a stand-in for Claude Code)
        run: |
          git config --global user.name "garry-ci"
          git config --global user.email "garry-ci@users.noreply.github.com"
          pnpm -C garry-tool test:threads
      - name: Skill security audit
        run: |
          pnpm -C garry-tool test:audit
          pnpm garry skills audit

  # The garry package as npm will ship it: bundle, pack, install the tarball into an
  # empty project and run the CLI there. The release workflow publishes only after
  # this (and every other job) is green on main.
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Pack and smoke test
        run: pnpm -C garry-tool smoke

  # The mobile app and the client it shares with the server: the client against a
  # real server, the app typechecked and bundled (the web export proves the bundle
  # resolves; the native builds come from Expo, see README).
  mobile:
    name: mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Client against a real server
        run: |
          pnpm -C garry-client typecheck
          pnpm -C garry-client test
      - name: Typecheck and bundle the app
        env:
          CI: "1"
        run: |
          pnpm -C garry-mobile typecheck
          pnpm -C garry-mobile export:web

  dash-guard:
    name: dash guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check for forbidden dashes
        run: node scripts/check-no-emdash.mjs

  security:
    name: security review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit
        run: pnpm audit --audit-level=high
      - name: Semgrep (SAST)
        run: |
          python3 -m pip install --quiet --disable-pip-version-check semgrep
          semgrep scan --config p/security-audit --config p/javascript --config p/typescript --error
