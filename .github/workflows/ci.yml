name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: validate (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [garry-registry, garry-skills]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - name: Install
        run: npm ci
        working-directory: ${{ matrix.package }}
      - name: Typecheck
        run: npm run typecheck
        working-directory: ${{ matrix.package }}
      - name: Validate
        run: npm run validate
        working-directory: ${{ matrix.package }}

  dash-guard:
    name: dash guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check for forbidden dashes
        run: node scripts/check-no-emdash.mjs

  security:
    name: security review
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (garry-registry)
        run: npm audit --audit-level=high
        working-directory: garry-registry
      - name: npm audit (garry-skills)
        run: npm audit --audit-level=high
        working-directory: garry-skills
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
