name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck (tool packages)
        run: pnpm --filter garry-registry --filter garry-skills --filter garry-tool run typecheck
      - name: Validate registry
        run: pnpm --filter garry-registry run validate
      - name: Validate skills
        run: pnpm --filter garry-skills run validate

  dash-guard:
    name: dash guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check for forbidden dashes
        run: node scripts/check-no-emdash.mjs

  security:
    name: security review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit
        run: pnpm audit --audit-level=high
      - name: Semgrep (SAST)
        run: |
          python3 -m pip install --quiet --disable-pip-version-check semgrep
          semgrep scan --config p/security-audit --config p/javascript --config p/typescript --error
