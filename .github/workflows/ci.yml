name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [garry-registry, garry-skills, garry-tool]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - name: Install
        run: npm ci
        working-directory: ${{ matrix.package }}
      - name: Typecheck
        run: npm run typecheck
        working-directory: ${{ matrix.package }}
      - name: Validate
        run: npm run validate
        working-directory: ${{ matrix.package }}

  dash-guard:
    name: dash guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check for forbidden dashes
        run: node scripts/check-no-emdash.mjs

  security:
    name: security review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit
        run: |
          for pkg in garry-registry garry-skills garry-tool; do
            echo "== audit $pkg =="
            (cd "$pkg" && npm audit --audit-level=high)
          done
      - name: Semgrep (SAST)
        run: |
          python3 -m pip install --quiet --disable-pip-version-check semgrep
          semgrep scan --config p/security-audit --config p/javascript --config p/typescript --error
