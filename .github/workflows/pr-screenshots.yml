name: PR screenshots

# When a pull request goes to code review (to a human or to a review agent), build
# the base and the head, screenshot every view in headless Chromium and post one
# comment with before, after and a pixel diff of what changed. The comment is
# edited on every push while the pull request is in review.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested, synchronize, closed]
    paths:
      - "garry-ui/**"
      - "garry-skills/**"
      - "garry-tool/src/**"
      - "garry-registry/examples/**"
      - "garry.screenshots.json"
      - ".github/workflows/pr-screenshots.yml"
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number"
        required: true

concurrency:
  group: pr-screenshots-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  SHOTS_BRANCH: garry-screenshots

jobs:
  screenshots:
    name: screenshots
    # Drafts are work in progress: skip them unless someone explicitly asks for a review.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.action != 'closed' &&
       (github.event.action == 'review_requested' || github.event.pull_request.draft == false))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          json=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}")
          {
            echo "number=${NUMBER}"
            echo "head_sha=$(jq -r .head.sha <<<"$json")"
            echo "base_sha=$(jq -r .base.sha <<<"$json")"
            echo "base_ref=$(jq -r .base.ref <<<"$json")"
            # fork pull requests get a read only token: capture, but do not publish
            echo "same_repo=$(jq -r '.head.repo.full_name == .base.repo.full_name' <<<"$json")"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install headless Chromium
        run: pnpm -C garry-tool exec playwright install --with-deps chromium

      - name: Build and start the head
        run: |
          NEXT_PUBLIC_GARRY_SERVER=http://localhost:8123 pnpm -C garry-ui build
          nohup pnpm serve --port 8123 > "$RUNNER_TEMP/head-server.log" 2>&1 &
          nohup pnpm -C garry-ui start -p 3000 > "$RUNNER_TEMP/head-ui.log" 2>&1 &
          timeout 120 bash -c 'until curl -sf http://localhost:8123/api/features > /dev/null && curl -sf http://localhost:3000 > /dev/null; do sleep 2; done'
      - name: Capture the head
        run: pnpm garry shots capture --url http://localhost:3000 --out "$RUNNER_TEMP/shots/head"

      # The base may not build (an older layout, a broken main): then every view is
      # reported as new instead of failing the job.
      - name: Build, start and capture the base
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          base="$RUNNER_TEMP/base"
          git worktree add --detach "$base" "$BASE_SHA"
          (cd "$base" && pnpm install --frozen-lockfile && NEXT_PUBLIC_GARRY_SERVER=http://localhost:8124 pnpm -C garry-ui build)
          (cd "$base" && nohup pnpm serve --port 8124 > "$RUNNER_TEMP/base-server.log" 2>&1 &)
          (cd "$base" && nohup pnpm -C garry-ui start -p 3001 > "$RUNNER_TEMP/base-ui.log" 2>&1 &)
          timeout 120 bash -c 'until curl -sf http://localhost:8124/api/features > /dev/null && curl -sf http://localhost:3001 > /dev/null; do sleep 2; done'
          # the head's tool and route list, so both sides are captured the same way
          pnpm garry shots capture --url http://localhost:3001 --out "$RUNNER_TEMP/shots/base"

      - name: Compare
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          pnpm garry shots compare \
            --base "$RUNNER_TEMP/shots/base" --head "$RUNNER_TEMP/shots/head" --out "$RUNNER_TEMP/shots/report" \
            --base-label "${BASE_REF} ${BASE_SHA:0:7}" --head-label "${HEAD_SHA:0:7}"

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ steps.pr.outputs.number }}-screenshots
          path: ${{ runner.temp }}/shots/report
          retention-days: 14
          if-no-files-found: ignore

      # Images live on an orphan branch so they never touch the code history. Only the
      # latest push of each pull request is kept; the cleanup job removes it on close.
      - name: Publish the images
        if: steps.pr.outputs.same_repo == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          pub="$RUNNER_TEMP/publish"
          mkdir -p "$pub" && cd "$pub"
          git init -q
          git config user.name "garry[bot]"
          git config user.email "garry-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          dir="pr-${NUMBER}/${HEAD_SHA:0:7}"
          for attempt in 1 2 3; do
            if git fetch -q --depth 1 origin "$SHOTS_BRANCH"; then
              git checkout -q -B "$SHOTS_BRANCH" FETCH_HEAD
            else
              # first run: start the branch with no parent
              git symbolic-ref HEAD "refs/heads/$SHOTS_BRANCH"
              printf '# PR screenshots\n\nWritten by the PR screenshots workflow. Do not merge this branch.\n' > README.md
            fi
            rm -rf "pr-${NUMBER}"
            mkdir -p "$dir"
            cp -r "$RUNNER_TEMP/shots/report/." "$dir/"
            git add -A
            git commit -q -m "screenshots for #${NUMBER} at ${HEAD_SHA:0:7}" || exit 0
            if git push -q origin "HEAD:${SHOTS_BRANCH}"; then exit 0; fi
            echo "push raced with another pull request, retrying ($attempt)"
            sleep $((attempt * 3))
          done
          exit 1

      - name: Comment on the pull request
        if: steps.pr.outputs.same_repo == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          pnpm garry shots comment \
            --report "$RUNNER_TEMP/shots/report/report.json" \
            --repo "$GITHUB_REPOSITORY" --pr "$NUMBER" \
            --images-url "https://github.com/${GITHUB_REPOSITORY}/blob/${SHOTS_BRANCH}/pr-${NUMBER}/${HEAD_SHA:0:7}/{path}?raw=true" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  cleanup:
    name: cleanup
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Remove this pull request's screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir pub && cd pub
          git init -q
          git config user.name "garry[bot]"
          git config user.email "garry-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$SHOTS_BRANCH" || exit 0
          git checkout -q -B "$SHOTS_BRANCH" FETCH_HEAD
          [ -d "pr-${NUMBER}" ] || exit 0
          git rm -rq "pr-${NUMBER}"
          git commit -q -m "remove screenshots for closed #${NUMBER}"
          git push -q origin "HEAD:${SHOTS_BRANCH}"
