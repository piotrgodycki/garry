<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" role="img" aria-label="Feature flow: a human describes an idea, Garry runs Spec, Plan and Design against the registry, then the contract first gate, then delegates Implement, Review and Test to a subagent in each of three repositories in dependency graph order, and Integrate merges the pull requests. Mistakes from review and test become lessons in the registry, which also holds the feature state and the contracts.">
  <title>The Garry SDLC</title>
  <style>
    svg { color: #f0f0f0; }
    text { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f0f0f0; }
    .mono { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { fill: #9a9a9a; }
    .box { fill: #0d1117; stroke: #f0f0f0; stroke-width: 1.5; }
    .zone { fill: none; stroke: #30363d; stroke-width: 1.5; stroke-dasharray: 5 5; }
    .flow { fill: none; stroke: #f0f0f0; stroke-width: 1.5; }
    .read { fill: none; stroke: #9a9a9a; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .gate { stroke: #ff4b2e; stroke-width: 3; }
    .learn { fill: none; stroke: #ff4b2e; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .signal { fill: #ff4b2e; }
    .registry { fill: #f0f0f0; }
    .on-registry { fill: #0d1117; }
    .on-registry-muted { fill: #0d1117; opacity: 0.7; }
    .opus { fill: #a78bfa; } .sonnet { fill: #38bdf8; } .haiku { fill: #2dd4bf; }
    </style>
  <rect width="1240" height="520" fill="#0d1117"/>
        <defs>
          <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#f0f0f0"/>
          </marker>
          <marker id="arr-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#ff4b2e"/>
          </marker>
          <marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/>
          </marker>
        </defs>
        <text x="140" y="48" font-size="11" font-weight="700" letter-spacing="1.2">GARRY · SUPERVISOR</text>
        <text x="1046" y="48" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="end">ONE SUBAGENT PER REPO · ISOLATED</text>
        <text x="636" y="48" font-size="11" font-weight="800" letter-spacing="1.2" text-anchor="middle" class="signal">CONTRACT FIRST</text>

        <rect class="zone" x="140" y="60" width="444" height="300"/>
        <rect class="zone" x="676" y="60" width="370" height="300"/>
        <rect class="box" x="16" y="208" width="96" height="56"/>
        <text x="64" y="232" font-size="14" font-weight="700" text-anchor="middle">Human</text>
        <text x="64" y="250" font-size="11" text-anchor="middle" class="muted">idea / voice</text>
        <line class="flow" x1="112" y1="236" x2="152" y2="236" marker-end="url(#arr)"/>
        <g>
          <rect class="box" x="156" y="192" width="128" height="88"/>
          <text x="168" y="212" font-size="11" class="mono muted">1</text>
          <text x="168" y="234" font-size="15" font-weight="700">Spec</text>
          <text x="168" y="254" font-size="11" class="mono muted">garry-analyst</text>
          <circle cx="172" cy="268" r="4" class="opus"/><text x="181" y="272" font-size="11">Opus 4.8</text>
          <text x="220" y="304" font-size="11" text-anchor="middle" class="mono">FEAT-123.md</text>
        </g>
        <line class="flow" x1="284" y1="236" x2="296" y2="236" marker-end="url(#arr)"/>
        <g>
          <rect class="box" x="298" y="192" width="128" height="88"/>
          <text x="310" y="212" font-size="11" class="mono muted">2</text>
          <text x="310" y="234" font-size="15" font-weight="700">Plan</text>
          <text x="310" y="254" font-size="11" class="mono muted">garry-analyst</text>
          <circle cx="314" cy="268" r="4" class="opus"/><text x="323" y="272" font-size="11">Opus 4.8</text>
          <text x="362" y="304" font-size="11" text-anchor="middle" class="mono">dependency graph</text>
        </g>
        <line class="flow" x1="426" y1="236" x2="438" y2="236" marker-end="url(#arr)"/>
        <g>
          <rect class="box" x="440" y="192" width="128" height="88"/>
          <text x="452" y="212" font-size="11" class="mono muted">3</text>
          <text x="452" y="234" font-size="15" font-weight="700">Design</text>
          <text x="452" y="254" font-size="11" class="mono muted">garry-analyst</text>
          <circle cx="456" cy="268" r="4" class="opus"/><text x="465" y="272" font-size="11">Opus 4.8</text>
          <text x="504" y="304" font-size="11" text-anchor="middle" class="mono">contract + version</text>
        </g>
        <line class="flow" x1="220" y1="314" x2="220" y2="436" marker-end="url(#arr)"/>
        <line class="flow" x1="362" y1="314" x2="362" y2="436" marker-end="url(#arr)"/>
        <line class="flow" x1="504" y1="314" x2="504" y2="436" marker-end="url(#arr)"/>
        <text x="228" y="384" font-size="11" class="muted">writes</text>
        <line class="gate" x1="636" y1="60" x2="636" y2="400"/>
        <text x="628" y="396" font-size="11" class="signal" font-weight="600" text-anchor="end">no code until the</text>
        <text x="628" y="410" font-size="11" class="signal" font-weight="600" text-anchor="end">contract validates</text>
        <text x="602" y="256" font-size="10" text-anchor="middle" class="mono muted">delegate</text>
        <path class="flow" d="M568 236 H636 C 662 236, 662 156, 686 156" marker-end="url(#arr)"/>
        <path class="flow" d="M636 236 H686" marker-end="url(#arr)"/>
        <path class="flow" d="M636 236 C 662 236, 662 316, 686 316" marker-end="url(#arr)"/>
        <text x="742" y="84" font-size="13" font-weight="700" text-anchor="middle">4 Implement</text>
        <circle cx="718" cy="99" r="4" class="haiku"/><text x="726" y="103" font-size="11" class="muted">Haiku 4.5</text>
        <text x="860" y="84" font-size="13" font-weight="700" text-anchor="middle">5 Review</text>
        <circle cx="838" cy="99" r="4" class="opus"/><text x="846" y="103" font-size="11" class="muted">Opus 4.8</text>
        <text x="978" y="84" font-size="13" font-weight="700" text-anchor="middle">6 Test</text>
        <circle cx="950" cy="99" r="4" class="sonnet"/><text x="958" y="103" font-size="11" class="muted">Sonnet 4.6</text>
        <text x="690" y="130" font-size="11" class="mono" font-weight="600">1 · search-mfe</text>
        <rect class="box" x="690" y="138" width="104" height="36"/><text x="742" y="160" font-size="11" text-anchor="middle">code + wiring</text>
        <line class="flow" x1="794" y1="156" x2="806" y2="156" marker-end="url(#arr)"/>
        <rect class="box" x="808" y="138" width="104" height="36"/><text x="860" y="160" font-size="11" text-anchor="middle">review PR</text>
        <line class="flow" x1="912" y1="156" x2="924" y2="156" marker-end="url(#arr)"/>
        <rect class="box" x="926" y="138" width="104" height="36"/><text x="978" y="160" font-size="11" text-anchor="middle">unit · e2e · drift</text>
        <text x="690" y="210" font-size="11" class="mono" font-weight="600">2 · checkout-mfe</text>
        <rect class="box" x="690" y="218" width="104" height="36"/><text x="742" y="240" font-size="11" text-anchor="middle">code + wiring</text>
        <line class="flow" x1="794" y1="236" x2="806" y2="236" marker-end="url(#arr)"/>
        <rect class="box" x="808" y="218" width="104" height="36"/><text x="860" y="240" font-size="11" text-anchor="middle">review PR</text>
        <line class="flow" x1="912" y1="236" x2="924" y2="236" marker-end="url(#arr)"/>
        <rect class="box" x="926" y="218" width="104" height="36"/><text x="978" y="240" font-size="11" text-anchor="middle">unit · e2e · drift</text>
        <text x="690" y="290" font-size="11" class="mono" font-weight="600">3 · shell</text>
        <rect class="box" x="690" y="298" width="104" height="36"/><text x="742" y="320" font-size="11" text-anchor="middle">code + wiring</text>
        <line class="flow" x1="794" y1="316" x2="806" y2="316" marker-end="url(#arr)"/>
        <rect class="box" x="808" y="298" width="104" height="36"/><text x="860" y="320" font-size="11" text-anchor="middle">review PR</text>
        <line class="flow" x1="912" y1="316" x2="924" y2="316" marker-end="url(#arr)"/>
        <rect class="box" x="926" y="298" width="104" height="36"/><text x="978" y="320" font-size="11" text-anchor="middle">unit · e2e · drift</text>
        <line class="read" x1="868" y1="440" x2="868" y2="364" marker-end="url(#arr-muted)"/>
        <text x="858" y="396" font-size="11" class="muted" text-anchor="end">reads contracts and lessons,</text>
        <text x="858" y="410" font-size="11" class="muted" text-anchor="end">never code of other repos</text>
        <path class="flow" d="M1030 156 C 1056 156, 1056 236, 1076 236" marker-end="url(#arr)"/>
        <path class="flow" d="M1030 236 H1076" marker-end="url(#arr)"/>
        <path class="flow" d="M1030 316 C 1056 316, 1056 236, 1076 236" marker-end="url(#arr)"/>
        <text x="1062" y="124" font-size="11" text-anchor="middle" class="muted">3 × PR</text>

        <g>
          <rect class="box" x="1080" y="192" width="140" height="88"/>
          <text x="1092" y="212" font-size="11" class="mono muted">7</text>
          <text x="1092" y="234" font-size="15" font-weight="700">Integrate</text>
          <text x="1092" y="254" font-size="11" class="mono muted">garry-dev</text>
          <circle cx="1096" cy="268" r="4" class="sonnet"/><text x="1105" y="272" font-size="11">Sonnet 4.6</text>
          <text x="1150" y="304" font-size="11" text-anchor="middle" class="mono">merge + tag</text>
        </g>
        <line class="flow" x1="1150" y1="314" x2="1150" y2="436" marker-end="url(#arr)"/>
        <line class="learn" x1="1002" y1="340" x2="1002" y2="436" marker-end="url(#arr-signal)"/>
        <text x="1010" y="396" font-size="11" font-weight="600" class="signal">mistake → lesson</text>
        <text x="1010" y="410" font-size="11" class="signal">lesson-capture</text>
        <rect class="registry" x="140" y="440" width="1080" height="64"/>
        <text x="160" y="468" font-size="15" font-weight="800" class="on-registry">@garry/registry</text>
        <text x="160" y="488" font-size="11.5" class="on-registry-muted">feature state, contracts and lessons · versioned on npm</text>
        <text x="1200" y="477" font-size="11.5" text-anchor="end" class="mono on-registry">features/ · contracts/ · catalog/ · lessons/</text>
      </svg>
