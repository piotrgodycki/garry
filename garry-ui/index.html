<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="AI SDLC orchestrator" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Garry</title>
    <!-- the stored theme, before first paint, so a dark choice never flashes light -->
    <script>
      try { var t = localStorage.getItem("garry-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
