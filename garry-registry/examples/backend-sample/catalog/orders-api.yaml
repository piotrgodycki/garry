name: orders-api
repo: git@github.com:example/orders-api.git
stack: node + fastify + postgres
kind: backend
owner: team-payments
exposes: []
consumes:
  payments-api: ["POST /charges"]
api:
  kind: openapi
  path: openapi.yaml
  version: "1.0.0"
db:
  engine: postgres
  name: orders
  migrations: db/migrations
